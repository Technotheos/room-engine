version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: room_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: room_engine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: room_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
